[project]
name = "rag"
version = "0.1.0"
description = "A local document RAG CLI powered by Chroma and Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
rag = "rag.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
